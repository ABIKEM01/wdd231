<!-- services.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Browse trusted Nigerian service providers, compare prices, and book professionals for home repairs, cleaning, automotive needs, and more on Servver."
    />
    <meta name="author" content="Abiodun Temitope Babayode" />
    <!-- Facebook Open Graph Meta -->
    <meta
      property="og:title"
      content="Servver — Book Trusted Service Providers in Nigeria"
    />

    <meta
      property="og:description"
      content="Discover and book verified Nigerian service professionals for home repairs, cleaning, automotive services, and more — fast, reliable, and affordable."
    />

    <meta
      property="og:image"
      content="https://abikem01.github.io/wdd231/finalproject/images/servver-hero.jpeg"
    />

    <meta
      property="og:url"
      content="https://abikem01.github.io/wdd231/finalproject/services.html"
    />

    <meta property="og:type" content="website" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;500;700&display=swap"
      rel="stylesheet"
    />

    <title>Servver — Services</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="styles/styles.css" />
    <script type="module" src="scripts/main.js"></script>
    <script type="module" src="scripts/service.js"></script>
  </head>
  <body>
    <header class="header">
      <div class="container header-inner">
        <div class="brand">
          <img src="images/servver-logo.webp" alt="Servver logo" />
          <h1>Servver</h1>
        </div>
        <nav class="main-nav" id="main-navigation" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="services.html">Services</a>
          <a href="contact.html">Contact</a>
        </nav>

        <button
          class="nav-toggle"
          aria-controls="main-navigation"
          aria-expanded="false"
        >
          ☰ Menu
        </button>
      </div>
    </header>

    <main class="container" id="main">
      <h2>Available Services</h2>

      <div id="controls">
        <label for="filter">Filter by category:</label>
        <select id="filter">
          <option value="all">All</option>
          <option>Household</option>
          <option>Automotive</option>
          <option>Plumbing</option>
          <option>Electrical</option>
          <option>Home Improvement</option>
          <option>Appliance</option>
        </select>
      </div>

      <section id="services-list" class="services-grid" aria-live="polite">
        <!-- JS will populate cards here (15+ dynamic items) -->
      </section>
    </main>

    <div
      id="detail-modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
      aria-labelledby="modal-title"
    >
      <div class="modal-content">
        <button class="close" aria-label="Close details">✕</button>
        <h3 class="modal-title" id="modal-title"></h3>
        <div class="modal-body"></div>
      </div>
    </div>

    <footer class="footer">
      <div class="container">
        <p>
          &copy; 2025 Servver —
          <a
            class="link-plain"
            target="_blank"
            href="https://www.loom.com/share/b9149c219da04d2883c245fd0540499a"
            >Demo Video</a
          >
        </p>
      </div>
    </footer>
  </body>
</html>
