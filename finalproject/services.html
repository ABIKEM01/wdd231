<!-- services.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Servver — browse available services" />
    <meta name="author" content="Abiodun Temitope Babayode" />
    <title>Servver — Services</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="styles/styles.css" />
    <script type="module" src="scripts/main.js" defer></script>
  </head>
  <body>
    <header class="header">
      <div class="container header-inner">
        <div class="brand">
          <img src="images/servver-logo.webp" alt="Servver logo" />
          <h1>Servver</h1>
        </div>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="services.html">Services</a>
          <a href="contact.html">Contact</a>
        </nav>

        <button
          class="nav-toggle"
          aria-controls="main-navigation"
          aria-expanded="false"
        >
          ☰ Menu
        </button>
      </div>
    </header>

    <main class="container" id="main">
      <h2>Available Services</h2>

      <div id="controls">
        <label for="filter">Filter by category:</label>
        <select id="filter">
          <option value="all">All</option>
          <option>Household</option>
          <option>Automotive</option>
          <option>Plumbing</option>
          <option>Electrical</option>
          <option>Home Improvement</option>
          <option>Appliance</option>
        </select>
      </div>

      <section id="services-list" class="services-grid" aria-live="polite">
        <!-- JS will populate cards here (15+ dynamic items) -->
      </section>
    </main>

    <div
      id="detail-modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
      aria-labelledby="modal-title"
    >
      <div class="modal-content">
        <button class="close" aria-label="Close details">✕</button>
        <h3 class="modal-title" id="modal-title"></h3>
        <div class="modal-body"></div>
      </div>
    </div>

    <footer class="footer">
      <div class="container">
        <p>
          &copy; 2025 Servver —
          <a
            href="https://youtu.be/yourvideo"
            style="color: inherit; text-decoration: underline"
            >Demo Video</a
          >
        </p>
      </div>
    </footer>

    <script type="module">
      // Extra small script for filtering (demonstrates DOM manipulation & array methods)
      import { fetchServices } from "./scripts/data.js";
      const select = document.getElementById("filter");
      const container = document.getElementById("services-list");

      async function loadAndRender(filter = "all") {
        try {
          const data = await fetchServices();
          let list = data;
          if (filter !== "all") {
            list = data.filter(
              (s) => s.category.toLowerCase() === filter.toLowerCase()
            );
          }
          // store for fast access in main.js too
          localStorage.setItem("servver_services", JSON.stringify(data));
          container.innerHTML = list
            .map((s) => {
              return `
            <article class="card" data-id="${
              s.id
            }" tabindex="0" aria-labelledby="svc-${s.id}-title">
              <img src="images/${
                s.image ? s.image.split("/").pop() : "placeholder.jpg"
              }" alt="${s.name} image" loading="lazy" />
              <h3 id="svc-${s.id}-title">${s.name}</h3>
              <p class="meta">${s.category} • ₦${s.price.toLocaleString()} • ${
                s.duration
              }</p>
              <p class="desc">${s.description}</p>
              <div class="card-actions">
                <button class="btn details" data-id="${s.id}">Details</button>
                <button class="btn ghost fav" data-id="${
                  s.id
                }" aria-pressed="false">♡ Save</button>
              </div>
            </article>`;
            })
            .join("");
          // attach events after rendering (reuse handlers from main.js)
          document.querySelectorAll(".card .details").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              const id = Number(e.currentTarget.dataset.id);
              // trigger main.js modal open using global function (populated in main.js)
              window.dispatchEvent(
                new CustomEvent("open-service-modal", { detail: { id } })
              );
            });
          });
        } catch (err) {
          container.innerHTML = '<p class="error">Failed to load services.</p>';
        }
      }

      select.addEventListener("change", (e) => loadAndRender(e.target.value));
      // initial load
      loadAndRender();
    </script>
  </body>
</html>
